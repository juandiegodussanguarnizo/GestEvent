<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GestEvent — Prototipo web</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="noauth">
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="app" id="app">
    <header class="topbar">
      <button class="btn ghost menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="side"></button>
      <a class="brand" href="#/inicio" aria-label="GestEvent, ir al inicio"><span class="logo" id="brandLogo">G</span><span id="brandName">GestEvent</span></a>
      <span class="spacer"></span>
      <span class="badge rolebadge userbox" id="roleBadge"></span>
      <a class="btn ghost sm acct userbox" id="acctBtn" href="#/perfil" aria-label="Mi cuenta"></a>
      <button class="btn ghost sm userbox" id="logoutBtn" aria-label="Cerrar sesión"></button>
    </header>
    <aside class="side" id="side" aria-label="Navegación principal"><nav id="nav"></nav></aside>
    <div class="scrim" id="scrim"></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
